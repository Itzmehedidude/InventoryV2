<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><link rel="manifest" href="./manifest.json"><link rel="stylesheet" href="./styles.css"><title>StockFlow</title></head>
<body>
<div id="authScreen" class="auth-screen" style="display:flex">
<div class="auth-card"><div class="auth-brand">StockFlow</div><h1 id="authTitle">Welcome back</h1><p id="authSubtitle">Sign in to access your inventory.</p>
<form id="authForm"><label class="field"><span>Email</span><input id="authEmail" type="email" autocomplete="email" required></label><label class="field"><span>Password</span><input id="authPassword" type="password" autocomplete="current-password" minlength="6" required></label><label class="field" id="authConfirmWrap" style="display:none"><span>Confirm password</span><input id="authConfirm" type="password" minlength="6"></label><button class="primary" id="authSubmit" type="submit">Sign In</button></form><button class="text-button" id="authSwitch" type="button">Create an account</button><div id="authMessage" class="auth-message"></div></div></div><div id="toast"></div><div id="appShell" style="display:none"><aside id="side"><div class="brand"><b>StockFlow</b><small>Offline Inventory</small></div><button data-page="dashboard" class="nav active">▦ Dashboard</button><button data-page="inventory" class="nav">▣ Inventory</button><button data-page="sales" class="nav">↗ Sales History</button><button data-page="reports" class="nav">◔ Reports</button><button data-page="settings" class="nav">⚙ Settings</button></aside>
<span id="userEmail" style="display:none"></span>
<main><header><div><button id="menu">☰</button><h1 id="title">Dashboard</h1><p id="sub">Overview of your stock and sales</p></div><button id="addTop" class="primary">＋ Add Product</button></header><section id="content"></section></main>
<div id="modal" class="overlay"><div id="modalBox" class="modal"></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./config.js"></script>
<script src="./app.js"></script></body></html>
